name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: scripts (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check every script
        run: |
          for f in plugins/dx-workflow/scripts/*.mjs plugins/dx-workflow/scripts/lib/*.mjs; do node --check "$f"; done
      - name: Hooks and plugin manifests are valid JSON
        run: |
          for f in plugins/dx-workflow/hooks/hooks.json plugins/dx-workflow/.claude-plugin/plugin.json .claude-plugin/marketplace.json plugins/dx-workflow/shared/verify.config.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f" || { echo "invalid JSON: $f"; exit 1; }
          done
      - run: npm test
